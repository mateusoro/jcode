name: Build jcode Binary

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: jcode-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: jcode-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: jcode-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact_name: jcode-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --release --bin jcode --locked
          # Strip binary for smaller size
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            strip target/release/jcode
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release/jcode
          retention-days: 7

  build-debug:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build debug
        run: cargo build --bin jcode --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcode-linux-x86_64-debug
          path: target/debug/jcode
          retention-days: 1
